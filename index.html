<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="3D-схема самоката YGW 5.0: детали, артикулы и фото из каталога запчастей.">
<title>Самокат YGW 5.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
html,body{margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
body{font-size:14px;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: full-screen 3D inspection bench; header + legend float on top, mode switch docked at the bottom, part card with catalog photo above it */
:root{
  --bg:#f4f5f7; --grid:#e5e8ee; --grid-strong:#d7dce4;
  --panel:#ffffffee; --line:#dfe3ea; --fg:#15181e; --muted:#6a7180;
  --accent:#1f2937; --accent-ink:#ffd400; --brand:#e0b400; --chip:#eef0f4;
  --shadow:0 6px 24px rgba(20,25,40,.08);
  --f-display:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --grid:#171a20; --grid-strong:#1e222a;
  --panel:#171a21ee; --line:#272c35; --fg:#eceef2; --muted:#8e95a3;
  --accent:#ffd400; --accent-ink:#15181e; --brand:#ffd400; --chip:#1f232b;
  --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115; --grid:#171a20; --grid-strong:#1e222a;
  --panel:#171a21ee; --line:#272c35; --fg:#eceef2; --muted:#8e95a3;
  --accent:#ffd400; --accent-ink:#15181e; --brand:#ffd400; --chip:#1f232b;
  --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-display);overflow:hidden;}
#app{position:relative;height:100%;width:100%}
#stage{position:absolute;inset:0}
#stage canvas{display:block;touch-action:none}

.top{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.top>*{pointer-events:auto}
.head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);backdrop-filter:blur(8px);max-width:360px}
.head h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.head h1 span{background:var(--brand);color:#15181e;padding:0 6px;border-radius:5px;margin-left:4px}
.head p{margin:4px 0 0;color:var(--muted);font-size:12.5px;line-height:1.4}
.head-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.lid-btn{all:unset;cursor:pointer;font:600 11.5px var(--f-display);padding:4px 10px;border-radius:7px;background:var(--accent);color:var(--accent-ink)}
.lid-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.lid-btn[aria-pressed="true"]{background:var(--brand);color:#15181e}
.stage-tag{display:inline-block;margin-top:0;font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--chip);padding:3px 8px;border-radius:6px}

.legend{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 12px 8px;box-shadow:var(--shadow);backdrop-filter:blur(8px);min-width:240px}
.count-lbl{font:500 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.count{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.count small{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.cover{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.cover b{color:var(--fg)}
.bar{height:4px;background:var(--chip);border-radius:3px;margin:8px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width 1.2s ease}
.groups{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.groups button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500}
.groups button:hover{background:var(--chip)}
.groups button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.groups button[aria-pressed="true"]{background:var(--chip);font-weight:700}
.groups .dot{width:8px;height:8px;border-radius:50%;flex:none}
.groups .nm{flex:1;min-width:0}
.groups .n{font:500 11px var(--f-mono);padding:1px 6px;border-radius:5px;font-variant-numeric:tabular-nums}
.toggle-legend{display:none}

.modes{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow);backdrop-filter:blur(8px);max-width:calc(100% - 32px);overflow-x:auto}
.modes button{all:unset;cursor:pointer;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.modes button:hover{color:var(--fg)}
.modes button:focus-visible{outline:2px solid var(--brand)}
.modes button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.mode-note{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(68px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);white-space:nowrap;pointer-events:none}

.card{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:300px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);backdrop-filter:blur(8px);max-height:calc(100% - 120px);overflow:auto;box-sizing:border-box}
.card .g{display:inline-flex;align-items:center;gap:6px;font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card .g i{width:8px;height:8px;border-radius:50%}
.card h2{margin:4px 0 2px;font-size:16px;font-weight:700;letter-spacing:-.01em;padding-right:20px}
.card .sub{font-size:11.5px;color:var(--muted);margin:0 0 8px}
.card .ph{background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;height:130px;margin-bottom:8px;overflow:hidden}
.card .ph img{max-height:120px;max-width:100%;object-fit:contain}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px}
.card dt{color:var(--muted)}
.card dd{margin:0;font-family:var(--f-mono);font-size:11.5px;min-width:0;overflow-wrap:anywhere}
.card .x{all:unset;position:absolute;top:8px;right:10px;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:2px 4px;border-radius:5px}
.card .x:focus-visible{outline:2px solid var(--brand)}
.copy{all:unset;cursor:pointer;font:500 10.5px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px}
.copy:focus-visible{outline:2px solid var(--brand)}

.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;transform:translate(12px,-120%);white-space:nowrap}
.row-lbl{position:absolute;pointer-events:none;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;transform:translate(-100%,-50%);white-space:nowrap;padding-right:8px}

@media (max-width:700px){
  .top{flex-direction:column;gap:8px;top:8px}
  .head{max-width:none;width:100%;padding:10px 12px;box-sizing:border-box}
  .head h1{font-size:17px}
  .head p{display:none}
  .stage-tag{margin-top:4px}
  .legend{width:100%;box-sizing:border-box;min-width:0;padding:8px 10px}
  .legend-top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
  .count{font-size:24px}
  .toggle-legend{display:inline-block;all:unset;cursor:pointer;font:500 11px var(--f-mono);color:var(--fg);padding:2px 4px}
  .legend.collapsed .groups,.legend.collapsed .bar{display:none}
  .groups{flex-direction:row;flex-wrap:wrap;gap:4px}
  .groups li{flex:0 0 auto}
  .groups button{width:auto;background:var(--chip);padding:4px 8px}
  .card{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;bottom:calc(66px + env(safe-area-inset-bottom,0px));max-height:52%}
  .card .ph{height:96px}.card .ph img{max-height:88px}
  .modes{bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .modes button{padding:8px 10px;font-size:12.5px}
  .mode-note{display:none}
  .row-lbl{font-size:9px}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>

<div id="app">
  <div id="stage" aria-label="3D-модель самоката YGW 5.0"></div>
  <div id="labels"></div>

  <div class="top">
    <header class="head">
      <h1>Электросамокат<span>YGW 5.0</span></h1>
      <p>Детали привязаны к каталогу запчастей: артикул, количество, цена и фото. Нажмите на деталь, чтобы открыть её карточку.</p>
      <div class="head-row"><span class="stage-tag">Версия 2 · по фото и каталогу</span><button class="lid-btn" id="lidBtn" type="button" aria-pressed="false">Снять крышку АКБ</button></div>
    </header>

    <aside class="legend" id="legend">
      <div class="legend-top">
        <div>
          <div class="count-lbl">Деталей в модели</div>
          <div class="count"><span id="count">0</span><small>шт.</small></div>
          <div class="cover">Артикулов каталога: <b id="covered">0</b> из <b id="catTotal">0</b></div>
        </div>
        <button class="toggle-legend" id="toggleLegend" type="button" aria-expanded="false">группы ▾</button>
      </div>
      <div class="bar"><i id="bar"></i></div>
      <ul class="groups" id="groups"></ul>
    </aside>
  </div>

  <div class="mode-note" id="modeNote"></div>
  <nav class="modes" role="tablist" id="modes">
    <button role="tab" data-mode="finished" aria-selected="true">Собран</button>
    <button role="tab" data-mode="xray" aria-selected="false">Рентген</button>
    <button role="tab" data-mode="cut" aria-selected="false">Разрез</button>
    <button role="tab" data-mode="explode" aria-selected="false">Разнесённый</button>
    <button role="tab" data-mode="layout" aria-selected="false">Все детали</button>
  </nav>

  <section class="card" id="card" hidden>
    <button class="x" id="cardClose" type="button" aria-label="Закрыть">×</button>
    <div class="g"><i id="cardDot"></i><span id="cardGroup"></span></div>
    <h2 id="cardName"></h2>
    <p class="sub" id="cardSub"></p>
    <div class="ph" id="cardPh"><img id="cardImg" alt=""></div>
    <dl id="cardDl"></dl>
  </section>
  <div class="tip" id="tip" hidden></div>
</div>

const composer = new THREE.EffectComposer(renderer);

function canvasTex(w, h, draw, rx=1, ry=1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;

  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;

/* ---------- Помощники геометрии ---------- */
const mesh = (g, m) => new THREE.Mesh(g, m);
const at = (o,x,y,z) => { o.position.set(x,y,z); return o; };
const box = (w,h,d,m,x,y,z,rz=0) => { const o = mesh(new THREE.BoxGeometry(w,h,d), m); o.position.set(x,y,z); o.rotation.z = rz; return o; };
const rbox = (w,h,d,r,m,x,y,z,rz=0) => { const o = mesh(new THREE.RoundedBoxGeometry(w,h,d,4,Math.min(r, w/2-0.001, h/2-0.001, d/2-0.001)), m); o.position.set(x,y,z); o.rotation.z = rz; return o; };
const cylZ = (r,h,m,x,y,z,seg=40) => { const o = mesh(new THREE.CylinderGeometry(r,r,h,seg), m); o.rotation.x = PI/2; o.position.set(x,y,z); return o; };
const orient = (o,a,b) => { const d = new V3().subVectors(b,a); o.position.copy(a).add(b).multiplyScalar(0.5); o.quaternion.setFromUnitVectors(new V3(0,1,0), d.normalize()); return o; };
const cylBetween = (a,b,r,m,seg=32,sz=1) => { const g = new THREE.CylinderGeometry(r,r,a.distanceTo(b),seg); if (sz !== 1) g.scale(1,1,sz); return orient(mesh(g, m), a, b); };
const boxBetween = (a,b,w,d,m) => orient(mesh(new THREE.BoxGeometry(w,a.distanceTo(b),d), m), a, b);
const rboxBetween = (a,b,w,d,r,m) => orient(mesh(new THREE.RoundedBoxGeometry(w,a.distanceTo(b),d,4,Math.min(r,w/2-0.001,d/2-0.001)), m), a, b);
const tube = (pts, r, m, seg=90) => mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p => p.isVector3 ? p : new V3(...p))), seg, r, 10, false), m);

// Выдавливание плоского профиля (в плоскости XY) на глубину по Z, со скруглённой кромкой
const ext = (shape, depth, m, bevel=0.04, z=0) => {
  const g = new THREE.ExtrudeGeometry(shape, {depth: depth - 2*bevel, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 32});
  g.translate(0, 0, -(depth - 2*bevel)/2 + z);
  return mesh(g, m);
};
// Контур со скруглёнными углами: [x, y, r?]
const roundedShape = (pts, r=0.15) => {
  const s = new THREE.Shape(), n = pts.length, V = i => new THREE.Vector2(pts[(i+n)%n][0], pts[(i+n)%n][1]);
  for (let i = 0; i < n; i++) {
    const c = V(i), p = V(i-1), q = V(i+1), rr = Math.min(pts[i][2] ?? r, c.distanceTo(p)/2, c.distanceTo(q)/2);
    const a = c.clone().add(p.clone().sub(c).normalize().multiplyScalar(rr)), b = c.clone().add(q.clone().sub(c).normalize().multiplyScalar(rr));
    i ? s.lineTo(a.x, a.y) : s.moveTo(a.x, a.y); s.quadraticCurveTo(c.x, c.y, b.x, b.y);
  }
  s.closePath(); return s;
};
const poly = pts => { const s = new THREE.Shape(); pts.forEach(([x,y],i) => i ? s.lineTo(x,y) : s.moveTo(x,y)); s.closePath(); return s; };
const roundRectPath = (x0,y0,x1,y1,r, P=THREE.Path) => { const p = new P(); p.moveTo(x0+r,y0); p.lineTo(x1-r,y0); p.quadraticCurveTo(x1,y0,x1,y0+r); p.lineTo(x1,y1-r); p.quadraticCurveTo(x1,y1,x1-r,y1); p.lineTo(x0+r,y1); p.quadraticCurveTo(x0,y1,x0,y1-r); p.lineTo(x0,y0+r); p.quadraticCurveTo(x0,y0,x0+r,y0); return p; };
// Шина: профиль со скруглёнными плечами, вращённый вокруг оси колеса
const tireMesh = (c, Ro, Ri, W) => {
  const h = W/2, pts = [];
  pts.push(new THREE.Vector2(Ri, -h*0.75));
  for (let i = 0; i <= 10; i++) { const a = -PI/2 + i/10*PI/2; pts.push(new THREE.Vector2(Ro - 0.16 + Math.cos(a)*0.16, -h + 0.16 + Math.sin(a)*0.16 + 0)); }
  for (let i = 0; i <= 10; i++) { const a = i/10*PI/2; pts.push(new THREE.Vector2(Ro - 0.16 + Math.cos(a)*0.16, h - 0.16 + Math.sin(a)*0.16)); }

  const t = treadTex.clone(); t.needsUpdate = true; t.repeat.set(1, 1);
  const m = M.tire.clone(); m.map = treadTex; treadTex.repeat.set(1, 1);

const spokedRim = (c, Ro, depth, n, m, hub=0.26, spokeW=0.34, z=0) => {
  const s = new THREE.Shape(); s.absarc(0,0,Ro,0,2*PI,false);
  const ri = hub + 0.08, ro = Ro - 0.12, half = (2*PI/n - spokeW)/2;
  for (let i = 0; i < n; i++) {
    const mid = i*2*PI/n + PI/n, a1 = mid - half, a2 = mid + half;
    const p = new THREE.Path(); p.moveTo(Math.cos(a1)*ri, Math.sin(a1)*ri);
    p.absarc(0,0,ro,a1,a2,false); p.lineTo(Math.cos(a2)*ri, Math.sin(a2)*ri); p.absarc(0,0,ri,a2,a1,true);
    s.holes.push(p);
  }
  const o = ext(s, depth, m, 0.03, z); o.position.add(c); return o;
};
// Крыло: дуга вокруг колеса (углы от +X против часовой, 90° — верх)
const fenderArc = (c, Ri, Ro, a1, a2, width, m) => {
  const s = new THREE.Shape(); s.absarc(0,0,Ro,a1,a2,false); s.absarc(0,0,Ri,a2,a1,true);
  const o = ext(s, width, m, 0.025); o.position.add(c); return o;

const helix = (base, axis, n1, len, r, turns, m, rad=0.028) => {
  const pts = [], n2 = new V3().crossVectors(axis, n1).normalize();
  for (let i = 0; i <= turns*24; i++) { const t = i/(turns*24), a = t*PI*2*turns; pts.push(base.clone().addScaledVector(axis, t*len).addScaledVector(n1, Math.cos(a)*r).addScaledVector(n2, Math.sin(a)*r)); }
  return tube(pts, rad, m, turns*48);
};

const root = new THREE.Group(); scene.add(root);
const parts = [];
function part(code, name, group, objs, flags={}) {
  objs = [].concat(objs);
  const g = new THREE.Group();
  const bb = new THREE.Box3(); objs.forEach(o => { o.updateMatrixWorld(); bb.expandByObject(o); });
  const c = bb.getCenter(new V3());
  objs.forEach(o => { o.position.sub(c); g.add(o); });
  g.position.copy(c);
  const p = {code, name, group, obj:g, flags, home:c.clone(), explode:c.clone(), layout:c.clone(), from:c.clone(), to:c.clone(), meshes:[],
    layoutQ:new THREE.Quaternion(), layoutS:1, qFrom:new THREE.Quaternion(), qTo:new THREE.Quaternion(), sFrom:1, sTo:1};
  g.userData.part = p;
  g.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    const finish = o.material.clone();
    const xr = new THREE.MeshBasicMaterial({color:GROUPS[group].color, transparent:true, depthWrite:false, side:THREE.DoubleSide});
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 28),
      new THREE.LineBasicMaterial({color:GROUPS[group].color, transparent:true, opacity:0.55}));
    edges.visible = false; o.add(edges);
    o.material = finish;
    p.meshes.push({mesh:o, finish, xr, edges, side:finish.side});
  });
  root.add(g); parts.push(p);
  return p;
}

/* ---------- Геометрия YGW 5.0, версия 2 (пропорции сняты с фото сбоку) ----------
   X — вдоль самоката (вперёд +X), Y — вверх, Z — поперёк (+Z справа по ходу). 1 ед. ≈ 10 см. */
const tilt = 13 * PI/180;
const dir = v(-Math.sin(tilt), Math.cos(tilt));       // рулевая ось
const nf  = v(Math.cos(tilt), Math.sin(tilt));        // «вперёд» поперёк рулевой оси

const R = v(-4.38, 1.03);                             // ось заднего мотор-колеса
const P = (k, dx=0, dy=0, dz=0) => A.clone().addScaledVector(dir, k).add(v(dx,dy,dz));
const F = (k, off, dz=0) => P(k).addScaledVector(nf, off).add(v(0,0,dz)); // точка перед/за рулевой осью

const DT = (t, off=0, z=0) => dtA.clone().lerp(dtB, t).addScaledVector(dtN, off).add(v(0,0,z));

part('763KG50-01-0', 'Боковой катафот левый',  'body', rbox(0.12,0.42,0.03,0.01, M.amber, P(0.7).x,P(0.7).y,-0.67, tilt), {ex:[0.6,0,-1.4]});
part('763KG50-01-0', 'Боковой катафот правый', 'body', rbox(0.12,0.42,0.03,0.01, M.amber, P(0.7).x,P(0.7).y, 0.67, tilt), {ex:[0.6,0, 1.4]});
part('934HL50-01-0', 'Шильдик (паспортная табличка)', 'body', boxBetween(DT(0.35,0,-0.69), DT(0.6,0,-0.69), 0.4, 0.02, M.steel), {ex:[0,0,-1.6]});

/* Разнесённый вид: смещение группы + свой вектор детали */
parts.forEach(p => {
  const ge = GROUPS[p.group].ex, pe = p.flags.ex || [0,0,0];
  p.explode.copy(p.home).add(v(ge[0]+pe[0], ge[1]+pe[1], ge[2]+pe[2]));
});

/* ---------- Раскладка «Все детали» ---------- */
const order = Object.keys(GROUPS);
const rowLabels = [];
(function computeLayout() {
  const gap = 0.45, rowGap = 0.8, maxW = 14;
  const rows = [];
  order.forEach(gk => {
    let row = {group:gk, items:[], w:0, h:0, first:true};
    parts.filter(p => p.group === gk).forEach(p => {
      p.layoutS = p.flags.flex ? 0.3 : 1;
      let size = new THREE.Box3().setFromObject(p.obj).getSize(new V3());
      if (size.y > size.x * 1.4) p.layoutQ.setFromAxisAngle(new V3(0,0,1), PI/2 + tilt);
      p.obj.quaternion.copy(p.layoutQ); p.obj.scale.setScalar(p.layoutS); p.obj.updateMatrixWorld(true);
      size = new THREE.Box3().setFromObject(p.obj).getSize(new V3());
      p.obj.quaternion.identity(); p.obj.scale.setScalar(1); p.obj.updateMatrixWorld(true);
      if (row.w + size.x > maxW && row.items.length) { rows.push(row); row = {group:gk, items:[], w:0, h:0, first:false}; }
      row.items.push({p, size, x: row.w + size.x/2}); row.w += size.x + gap; row.h = Math.max(row.h, size.y);
    });
    rows.push(row);
  });
  let y = 0;
  rows.slice().reverse().forEach(r => { r.y = y + r.h/2; y += r.h + rowGap; });
  const width = Math.max(...rows.map(r => r.w));
  rows.forEach(r => {
    const x0 = -width/2;
    r.items.forEach(it => it.p.layout.set(x0 + it.x, r.y + 0.2, 0));
    if (r.first) rowLabels.push({group:r.group, pos:new V3(x0 - 0.2, r.y + 0.2, 0)});
  });
})();

const labelsEl = document.getElementById('labels');
rowLabels.forEach(l => {
  const d = document.createElement('div'); d.className = 'row-lbl'; d.textContent = GROUPS[l.group].name;
  d.style.color = GROUPS[l.group].color; d.hidden = true; labelsEl.appendChild(d); l.el = d;
});

/* ---------- Легенда и покрытие каталога ---------- */
const groupsEl = document.getElementById('groups');
let isolated = null;
order.forEach(gk => {
  const n = parts.filter(p => p.group === gk).length;
  const li = document.createElement('li'), c = GROUPS[gk].color;
  li.innerHTML = `<button type="button" aria-pressed="false" data-g="${gk}"><span class="dot" style="background:${c}"></span><span class="nm">${GROUPS[gk].name}</span><span class="n" style="color:${c};background:${c}1f">${n}</span></button>`;
  groupsEl.appendChild(li);
});
groupsEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  isolated = isolated === b.dataset.g ? null : b.dataset.g;
  groupsEl.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.g === isolated));
  applyLook();
});
const legend = document.getElementById('legend'), tl = document.getElementById('toggleLegend');
if (matchMedia('(max-width:700px)').matches) legend.classList.add('collapsed');
tl.addEventListener('click', () => { const c = legend.classList.toggle('collapsed'); tl.textContent = c ? 'группы ▾' : 'скрыть ▴'; tl.setAttribute('aria-expanded', !c); });

const total = parts.length, countEl = document.getElementById('count');
const catTotal = Object.keys(CATALOG).length;
const covered = new Set(parts.map(p => p.code).filter(c => CATALOG[c])).size;
document.getElementById('catTotal').textContent = catTotal;
document.getElementById('covered').textContent = covered;
(function countUp(t0) {
  const step = now => { const k = reduceMotion ? 1 : Math.min(1, (now - t0)/1400); countEl.textContent = Math.round(total * (1 - Math.pow(1-k,3))); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
})(performance.now());
requestAnimationFrame(() => document.getElementById('bar').style.width = (covered/catTotal*100).toFixed(1) + '%');

/* ---------- Режимы ---------- */
let mode = 'finished', selected = null, hovered = null;
const cutPlane = new THREE.Plane(new V3(0,0,-1), 0.02), CLIP = [cutPlane];
const NOTES = {
  finished:'Собранный самокат',
  xray:'Корпус прозрачный: видно аккумулятор, контроллер и проводку',
  cut:'Продольный разрез: дека, шея рамы, стойка и колёса',
  explode:'Узлы разведены по группам',
  layout:'Все детали по группам',
};
const HL = new THREE.Color(0x8a6a00), HOV = new THREE.Color(0x3a2d00);
function applyLook() {
  parts.forEach(p => {
    const sel = p === selected, hov = p === hovered;
    const ghost = isolated && p.group !== isolated;
    p.meshes.forEach(m => {
      const xray = mode === 'xray';
      m.mesh.material = xray ? m.xr : m.finish;
      m.edges.visible = xray && !ghost;
      if (xray) {
        m.xr.opacity = ghost ? 0.03 : sel ? 0.85 : p.flags.inner ? 0.7 : 0.13;
      } else {
        const f = m.finish;
        const clip = mode === 'cut' && p.flags.shell ? CLIP : null;
        if ((f.clippingPlanes||null) !== clip) { f.clippingPlanes = clip; f.side = clip ? THREE.DoubleSide : m.side; f.needsUpdate = true; }
        const wantT = !!ghost;
        if (f.transparent !== wantT) { f.transparent = wantT; f.needsUpdate = true; }
        f.opacity = ghost ? 0.1 : 1; f.depthWrite = !ghost;
        if (!m.baseEm) m.baseEm = f.emissive.clone();
        f.emissive.copy(sel ? HL : hov ? HOV : m.baseEm);
      }
      m.mesh.castShadow = !ghost && mode !== 'xray';
    });
  });
  ground.visible = mode !== 'xray' && mode !== 'layout';
  setPost(mode);
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('#modes button').forEach(b => b.setAttribute('aria-selected', b.dataset.mode === m));
  document.getElementById('modeNote').textContent = NOTES[m];
  const key = m === 'explode' ? 'explode' : m === 'layout' ? 'layout' : 'home', lay = m === 'layout';
  parts.forEach(p => {
    p.from.copy(p.obj.position); p.to.copy(p[key]);
    p.qFrom.copy(p.obj.quaternion); lay ? p.qTo.copy(p.layoutQ) : p.qTo.identity();
    p.sFrom = p.obj.scale.x; p.sTo = lay ? p.layoutS : 1;
  });
  tweenStart = performance.now();
  rowLabels.forEach(l => l.el.hidden = m !== 'layout');
  applyLid();
  frameCamera(m);
  applyLook();
}
document.getElementById('modes').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setMode(b.dataset.mode); });

/* ---------- Камера ---------- */
let camTween = null;
function fitDist(radius) {
  const vf = camera.fov * PI/180, hf = 2*Math.atan(Math.tan(vf/2)*camera.aspect);
  return radius / Math.sin(Math.min(vf, hf)/2);
}
function frameCamera(m, instant) {
  let target, dirv, radius;
  if (m === 'layout') {
    const bb = new THREE.Box3(); parts.forEach(p => bb.expandByPoint(p.layout));
    target = bb.getCenter(new V3()); const s = bb.getSize(new V3());
    target.x -= 1.2; target.y -= 0.4;
    radius = Math.max(s.x/2 + 3.2, s.y/2 + 3.4); target.y += 0.6; dirv = v(0, 0.08, 1).normalize();
  } else {
    target = v(-0.6, 5.4, 0);
    radius = m === 'explode' ? 8.8 : 7.0;
    dirv = m === 'cut' ? v(0.2, 0.25, 1).normalize() : v(0.55, 0.3, 0.95).normalize();
  }
  const pos = target.clone().addScaledVector(dirv, fitDist(radius));
  if (instant || reduceMotion) { camera.position.copy(pos); controls.target.copy(target); camTween = null; return; }
  camTween = {t0:performance.now(), p0:camera.position.clone(), q0:controls.target.clone(), p1:pos, q1:target};
}

/* ---------- Выбор детали ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const tip = document.getElementById('tip');
/* Снять / поставить крышку аккумуляторного отсека */
let lidOff = false;
const lidParts = parts.filter(p => p.code === '141HL50-01-0' || p.code === '142ZD50-02-0');
const lidBtn = document.getElementById('lidBtn');
function applyLid() {
  const hide = lidOff && mode !== 'layout' && mode !== 'explode';
  lidParts.forEach(p => { p.obj.visible = !hide; if (hide && selected === p) select(null); });
}
lidBtn.addEventListener('click', () => {
  lidOff = !lidOff; lidBtn.setAttribute('aria-pressed', lidOff);
  lidBtn.textContent = lidOff ? 'Поставить крышку АКБ' : 'Снять крышку АКБ';
  applyLid();
});
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left)/r.width)*2 - 1, -((ev.clientY - r.top)/r.height)*2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(root.children, true).filter(h => h.object.isMesh);
  for (const h of hits) {
    let o = h.object; while (o && !o.userData.part) o = o.parent;
    const p = o && o.userData.part; if (!p || !p.obj.visible) continue;
    if (isolated && p.group !== isolated) continue;
    if (mode === 'cut' && p.flags.shell && h.point.z > cutPlane.constant) continue;
    return p;
  }
  return null;
}
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => downAt = {x:e.clientX, y:e.clientY});
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6) return;
  select(pick(e));
});
renderer.domElement.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const p = pick(e);
  if (p !== hovered) { hovered = p; applyLook(); renderer.domElement.style.cursor = p ? 'pointer' : ''; }
  if (p) { tip.hidden = false; tip.textContent = p.name; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; }
  else tip.hidden = true;
});
renderer.domElement.addEventListener('pointerleave', () => { tip.hidden = true; hovered = null; applyLook(); });

const card = document.getElementById('card'), img = document.getElementById('cardImg'), ph = document.getElementById('cardPh');
img.addEventListener('error', () => ph.hidden = true);
img.addEventListener('load', () => ph.hidden = false);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function select(p) {
  selected = p; applyLook();
  if (!p) { card.hidden = true; return; }
  const g = GROUPS[p.group], c = CATALOG[p.code];
  document.getElementById('cardDot').style.background = g.color;
  document.getElementById('cardGroup').textContent = g.name;
  document.getElementById('cardName').textContent = p.name;
  document.getElementById('cardSub').textContent = c ? [c[0], c[1]].filter(Boolean).join(' · ') : 'Нет в листе Catalog, есть на листе узла';
  ph.hidden = true; img.src = 'thumbs/' + encodeURIComponent(p.code) + '.jpg';
  const rows = [['Артикул', `${esc(p.code)}<button class="copy" type="button" id="copyBtn">копировать</button>`]];
  if (c) {
    rows.push(['На самокат', `${esc(c[2])} ${esc((c[3]||'').toLowerCase() === 'pc' ? 'шт.' : (c[3]||'').toLowerCase() === 'st' ? 'компл.' : c[3])}`]);
    if (c[4] != null) rows.push(['Цена 2025', esc(typeof c[4] === 'number' ? c[4].toFixed(2) : c[4])]);
    if (c[5] != null) rows.push(['MOQ', esc(c[5])]);
    if (c[6] != null) rows.push(['Срок поставки', esc(c[6]) + (typeof c[6] === 'number' ? ' дн.' : '')]);
    rows.push(['Тип', c[7] === 'EE' ? 'электрика (EE)' : 'механика (ME)']);
  }
  document.getElementById('cardDl').innerHTML = rows.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  document.getElementById('copyBtn').addEventListener('click', ev => {
    const b = ev.currentTarget;
    Promise.resolve().then(() => navigator.clipboard.writeText(p.code)).then(() => b.textContent = 'скопировано', () => {
      const r = document.createRange(); r.selectNodeContents(b.parentNode.firstChild.parentNode); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    });
  });
  card.hidden = false;
}
document.getElementById('cardClose').addEventListener('click', () => select(null));

/* ---------- Цикл ---------- */
let tweenStart = 0;
const DUR = reduceMotion ? 1 : 950;
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3)/2;
const tmp = new V3();
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); renderer.domElement.style.width = w+'px'; renderer.domElement.style.height = h+'px';
  composer.setPixelRatio(PR); composer.setSize(w, h);
  fxaaPass.material.uniforms.resolution.value.set(1/(w*PR), 1/(h*PR));
  camera.aspect = w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', () => { resize(); frameCamera(mode, true); });

function loop(now) {
  parts.forEach((p, i) => {
    const k = Math.min(1, Math.max(0, (now - tweenStart - i*6) / DUR)), e = ease(k);
    p.obj.position.lerpVectors(p.from, p.to, e);
    p.obj.quaternion.slerpQuaternions(p.qFrom, p.qTo, e);
    p.obj.scale.setScalar(p.sFrom + (p.sTo - p.sFrom) * e);
  });
  if (camTween) {
    const k = Math.min(1, (now - camTween.t0)/1100), e = ease(k);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.q0, camTween.q1, e);
    if (k >= 1) camTween = null;
  }
  controls.update();
  composer.render();
  if (mode === 'layout') {
    const w = stage.clientWidth, h = stage.clientHeight;
    rowLabels.forEach(l => { tmp.copy(l.pos).project(camera); l.el.style.left = ((tmp.x+1)/2*w) + 'px'; l.el.style.top = ((1-tmp.y)/2*h) + 'px'; });
  }
  requestAnimationFrame(loop);
}

resize();
frameCamera('finished', true);
setMode('finished');
requestAnimationFrame(loop);
})();
</script>

</body>
